<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MAL.0</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8b0000}body{display:flex;align-items:center;justify-content:center;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;background:radial-gradient(circle at center,#c40000 0%,#970000 48%,#5a0000 100%)}.warning{position:relative;width:min(76vw,650px);aspect-ratio:1/.9;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 24px rgba(0,0,0,.65));animation:pulse 2.8s infinite ease-in-out}.warning:before{content:"";position:absolute;inset:0;background:#050505;clip-path:polygon(50% 0%,100% 100%,0% 100%)}.warning:after{content:"";position:absolute;inset:14px;background:#d00000;clip-path:polygon(50% 0%,100% 100%,0% 100%)}.content{position:absolute;z-index:2;top:17%;bottom:7%;left:15%;right:15%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.exclamation{color:#080808;font-family:Arial Black,Impact,sans-serif;font-size:clamp(4rem,11vw,7.5rem);line-height:.75;margin-bottom:8%;text-shadow:2px 2px 0 rgba(255,255,255,.08)}.malo{color:#080808;font-size:clamp(2.2rem,6.5vw,5rem);line-height:.9;letter-spacing:.06em;white-space:nowrap;text-shadow:2px 2px 0 rgba(255,255,255,.08),-1px -1px 0 rgba(0,0,0,.8);transform:scaleY(1.08)}.scanlines{pointer-events:none;position:fixed;inset:0;z-index:10;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.06) 0,rgba(0,0,0,.06) 1px,transparent 1px,transparent 5px);mix-blend-mode:multiply}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}@media(max-width:500px){.warning{width:88vw}.content{top:18%;bottom:6%}}</style></head><body><div class="warning" aria-label="Advertencia MAL0"><div class="content"><div class="exclamation">!</div><div class="malo">MAL.0</div></div></div><div class="scanlines"></div></body></html>
